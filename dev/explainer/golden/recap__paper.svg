<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Three Rules for Reliable Agent Tooling"><title>Three Rules for Reliable Agent Tooling</title><desc>Recap card: Three Rules for Reliable Agent Tooling (3 takeaways, illustrative).</desc><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#57534E"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#C2410C"/></marker></defs><rect id="frame-bg" x="0" y="0" width="1280" height="720" rx="0.0" fill="#FAF7F2" stroke="none" stroke-width="0"/><text id="header-eyebrow" class="reveal" style="--d:0.00s;letter-spacing:0.08em" x="64" y="74.92" font-size="13" font-weight="700" fill="#C2410C" text-anchor="start"><tspan x="64" y="74.92">EXECUTIVE SUMMARY</tspan></text><text id="header-title" class="reveal" style="--d:0.00s" x="64" y="121.6" font-size="40" font-weight="750" fill="#1C1917" text-anchor="start"><tspan x="64" y="121.6">Three Rules for Reliable Agent Tooling</tspan></text><rect id="recap-0" class="reveal" style="--d:0.16s" x="64.0" y="167.6" width="1152.0" height="140.0" rx="16.0" fill="#FFFFFF" stroke="#DDD5C4" stroke-width="1.5"/><rect id="recap-strip-0" class="reveal" style="--d:0.25s" x="64.0" y="167.6" width="6.0" height="140.0" rx="3.0" fill="#C2410C" stroke="none" stroke-width="0"/><circle id="recap-num-bg-0" class="reveal" style="--d:0.34s" cx="108.0" cy="237.6" r="18.0" fill="#F3EDE2" stroke="#C2410C" stroke-width="2"/><text id="recap-num-0" class="reveal" style="--d:0.43s" x="108.0" y="242.2" font-size="15" font-weight="800" fill="#C2410C" text-anchor="middle"><tspan x="108.0" y="242.2">1</tspan></text><text id="recap-title-0" class="reveal" style="--d:0.52s" x="146.0" y="227.72" font-size="20" font-weight="750" fill="#1C1917" text-anchor="start"><tspan x="146.0" y="227.72">Validate All Errors in One Pass</tspan></text><text id="recap-detail-0" class="reveal" style="--d:0.61s" x="146.0" y="256.8" font-size="17" font-weight="450" fill="#57534E" text-anchor="start"><tspan x="146.0" y="256.8">Return every broken field path together so the model repairs specs in one retry.</tspan></text><rect id="recap-1" class="reveal" style="--d:0.70s" x="64.0" y="323.6" width="1152.0" height="140.0" rx="16.0" fill="#FFFFFF" stroke="#DDD5C4" stroke-width="1.5"/><rect id="recap-strip-1" class="reveal" style="--d:0.79s" x="64.0" y="323.6" width="6.0" height="140.0" rx="3.0" fill="#0F766E" stroke="none" stroke-width="0"/><circle id="recap-num-bg-1" class="reveal" style="--d:0.88s" cx="108.0" cy="393.6" r="18.0" fill="#F3EDE2" stroke="#0F766E" stroke-width="2"/><text id="recap-num-1" class="reveal" style="--d:0.97s" x="108.0" y="398.2" font-size="15" font-weight="800" fill="#0F766E" text-anchor="middle"><tspan x="108.0" y="398.2">2</tspan></text><text id="recap-title-1" class="reveal" style="--d:1.06s" x="146.0" y="383.72" font-size="20" font-weight="750" fill="#1C1917" text-anchor="start"><tspan x="146.0" y="383.72">Keep Layout Math Deterministic</tspan></text><text id="recap-detail-1" class="reveal" style="--d:1.15s" x="146.0" y="412.8" font-size="17" font-weight="450" fill="#57534E" text-anchor="start"><tspan x="146.0" y="412.8">Let code compute coordinates, wrapping, and WCAG contrast instead of freehand SVG.</tspan></text><rect id="recap-2" class="reveal" style="--d:1.24s" x="64.0" y="479.6" width="1152.0" height="140.0" rx="16.0" fill="#FFFFFF" stroke="#DDD5C4" stroke-width="1.5"/><rect id="recap-strip-2" class="reveal" style="--d:1.33s" x="64.0" y="479.6" width="6.0" height="140.0" rx="3.0" fill="#1D4ED8" stroke="none" stroke-width="0"/><circle id="recap-num-bg-2" class="reveal" style="--d:1.42s" cx="108.0" cy="549.6" r="18.0" fill="#F3EDE2" stroke="#1D4ED8" stroke-width="2"/><text id="recap-num-2" class="reveal" style="--d:1.51s" x="108.0" y="554.2" font-size="15" font-weight="800" fill="#1D4ED8" text-anchor="middle"><tspan x="108.0" y="554.2">3</tspan></text><text id="recap-title-2" class="reveal" style="--d:1.60s" x="146.0" y="539.72" font-size="20" font-weight="750" fill="#1C1917" text-anchor="start"><tspan x="146.0" y="539.72">Mark Unsourced Numbers Clearly</tspan></text><text id="recap-detail-2" class="reveal" style="--d:1.69s" x="146.0" y="568.8" font-size="17" font-weight="450" fill="#57534E" text-anchor="start"><tspan x="146.0" y="568.8">Separate real cited figures from illustrative examples to preserve user trust.</tspan></text><text id="footer-source" class="reveal" style="--d:1.96s" x="64" y="654.92" font-size="13" font-weight="500" fill="#57534E" text-anchor="start"><tspan x="64" y="654.92">Synaptix Architecture Guidelines</tspan></text><rect id="badge-pill" class="reveal" style="--d:2.03s" x="1053.25" y="638" width="162.75" height="26" rx="13.0" fill="#F3EDE2" stroke="#DDD5C4" stroke-width="1"/><text id="badge-label" class="reveal" style="--d:2.10s;letter-spacing:0.06em" x="1134.62" y="653.24" font-size="11" font-weight="700" fill="#57534E" text-anchor="middle"><tspan x="1134.62" y="653.24">ILLUSTRATIVE DATA</tspan></text></svg>