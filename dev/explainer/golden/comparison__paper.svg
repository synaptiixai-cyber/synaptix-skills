<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="BM25 Lexical vs Hybrid Vector RAG"><title>BM25 Lexical vs Hybrid Vector RAG</title><desc>Comparison: BM25 Lexical vs Hybrid Vector RAG (2 options, illustrative).</desc><defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#57534E"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#C2410C"/></marker></defs><rect id="frame-bg" x="0" y="0" width="1280" height="720" rx="0.0" fill="#FAF7F2" stroke="none" stroke-width="0"/><text id="header-eyebrow" class="reveal" style="--d:0.00s;letter-spacing:0.08em" x="64" y="74.92" font-size="13" font-weight="700" fill="#C2410C" text-anchor="start"><tspan x="64" y="74.92">RETRIEVAL DESIGN</tspan></text><text id="header-title" class="reveal" style="--d:0.00s" x="64" y="121.6" font-size="40" font-weight="750" fill="#1C1917" text-anchor="start"><tspan x="64" y="121.6">BM25 Lexical vs Hybrid Vector RAG</tspan></text><rect id="col-0" class="reveal" style="--d:0.16s" x="64.0" y="165.2" width="565.0" height="384.8" rx="16.0" fill="#FFFFFF" stroke="#DDD5C4" stroke-width="1.5"/><rect id="col-accent-0" class="reveal" style="--d:0.25s" x="64.0" y="165.2" width="565.0" height="6.0" rx="3.0" fill="#C2410C" stroke="none" stroke-width="0"/><g id="col-icon-0" class="reveal" style="--d:0.34s" transform="translate(86.0,187.2) scale(1.0)" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></g><text id="col-title-0" class="reveal" style="--d:0.43s" x="122.0" y="204.0" font-size="20" font-weight="750" fill="#1C1917" text-anchor="start"><tspan x="122.0" y="204.0">BM25 Lexical Only</tspan></text><line id="col-sep-0" class="reveal" style="--d:0.52s" x1="86.0" y1="227.2" x2="607.0" y2="227.2" stroke="#E5DEC9" stroke-width="1" stroke-linecap="round"/><circle id="col-dot-0-0" class="reveal" style="--d:0.61s" cx="91.0" cy="253.06" r="4.0" fill="#C2410C" stroke="none" stroke-width="0"/><text id="col-pt-0-0" class="reveal" style="--d:0.70s" x="106.0" y="257.48" font-size="17" font-weight="450" fill="#1C1917" text-anchor="start"><tspan x="106.0" y="257.48">Sub-10ms lookup with zero embedding cost</tspan></text><circle id="col-dot-0-1" class="reveal" style="--d:0.79s" cx="91.0" cy="288.82" r="4.0" fill="#C2410C" stroke="none" stroke-width="0"/><text id="col-pt-0-1" class="reveal" style="--d:0.88s" x="106.0" y="293.24" font-size="17" font-weight="450" fill="#1C1917" text-anchor="start"><tspan x="106.0" y="293.24">Exact SKU, code symbol, and acronym precision</tspan></text><circle id="col-dot-0-2" class="reveal" style="--d:0.97s" cx="91.0" cy="324.58" r="4.0" fill="#C2410C" stroke="none" stroke-width="0"/><text id="col-pt-0-2" class="reveal" style="--d:1.06s" x="106.0" y="329.0" font-size="17" font-weight="450" fill="#1C1917" text-anchor="start"><tspan x="106.0" y="329.0">Misses paraphrases and cross-lingual synonyms</tspan></text><rect id="col-1" class="reveal" style="--d:1.15s" x="651.0" y="165.2" width="565.0" height="384.8" rx="16.0" fill="#FFFFFF" stroke="#DDD5C4" stroke-width="1.5"/><rect id="col-accent-1" class="reveal" style="--d:1.24s" x="651.0" y="165.2" width="565.0" height="6.0" rx="3.0" fill="#0F766E" stroke="none" stroke-width="0"/><g id="col-icon-1" class="reveal" style="--d:1.33s" transform="translate(673.0,187.2) scale(1.0)" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 10-12h-7l0-8z"/></g><text id="col-title-1" class="reveal" style="--d:1.42s" x="709.0" y="204.0" font-size="20" font-weight="750" fill="#1C1917" text-anchor="start"><tspan x="709.0" y="204.0">Hybrid + Reranker</tspan></text><line id="col-sep-1" class="reveal" style="--d:1.51s" x1="673.0" y1="227.2" x2="1194.0" y2="227.2" stroke="#E5DEC9" stroke-width="1" stroke-linecap="round"/><circle id="col-dot-1-0" class="reveal" style="--d:1.60s" cx="678.0" cy="253.06" r="4.0" fill="#0F766E" stroke="none" stroke-width="0"/><text id="col-pt-1-0" class="reveal" style="--d:1.69s" x="693.0" y="257.48" font-size="17" font-weight="450" fill="#1C1917" text-anchor="start"><tspan x="693.0" y="257.48">Combines dense recall with exact term matching</tspan></text><circle id="col-dot-1-1" class="reveal" style="--d:1.78s" cx="678.0" cy="288.82" r="4.0" fill="#0F766E" stroke="none" stroke-width="0"/><text id="col-pt-1-1" class="reveal" style="--d:1.87s" x="693.0" y="293.24" font-size="17" font-weight="450" fill="#1C1917" text-anchor="start"><tspan x="693.0" y="293.24">Handles natural-language questions reliably</tspan></text><circle id="col-dot-1-2" class="reveal" style="--d:1.96s" cx="678.0" cy="324.58" r="4.0" fill="#0F766E" stroke="none" stroke-width="0"/><text id="col-pt-1-2" class="reveal" style="--d:2.05s" x="693.0" y="329.0" font-size="17" font-weight="450" fill="#1C1917" text-anchor="start"><tspan x="693.0" y="329.0">Adds ~45ms embedding + reranker latency</tspan></text><rect id="badge-pill" class="reveal" style="--d:2.32s" x="1053.25" y="638" width="162.75" height="26" rx="13.0" fill="#F3EDE2" stroke="#DDD5C4" stroke-width="1"/><text id="badge-label" class="reveal" style="--d:2.39s;letter-spacing:0.06em" x="1134.62" y="653.24" font-size="11" font-weight="700" fill="#57534E" text-anchor="middle"><tspan x="1134.62" y="653.24">ILLUSTRATIVE DATA</tspan></text><rect id="verdict-bar" class="reveal" style="--d:2.46s" x="64.0" y="568.0" width="1152.0" height="48.0" rx="12.0" fill="#F3EDE2" stroke="#C2410C" stroke-width="1.5"/><text id="verdict-txt" class="reveal" style="--d:2.54s" x="86.0" y="595.6" font-size="18" font-weight="700" fill="#1C1917" text-anchor="start"><tspan x="86.0" y="595.6">Use Hybrid + Reranker for user Q&amp;A; keep BM25 for exact identifier lookup.</tspan></text></svg>